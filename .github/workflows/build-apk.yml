
name: Build Kasey Expense Tracker APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'pyproject.toml'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flet-cli==0.27.6

      - name: Build APK
        run: |
          flet build apk \
            --project "Kasey Expense Tracker" \
            --product "Kasey Expense Tracker" \
            --bundle-id "com.kasey.expensetracker" \
            --build-version "1.0.0" \
            --build-number ${{ github.run_number }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kasey-Expense-Tracker-APK
          path: build/apk/*.apk
          if-no-files-found: error
          retention-days: 30
